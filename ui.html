<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Llama Layer Ablation — Baseline vs Ablated</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa4b2; --accent: #6ea8fe; --base: #4ec9b0;
    --abl: #f0a35e; --danger: #f06e6e; --ok: #6ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .controls {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .controls .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px;
    font: inherit; resize: vertical;
  }
  textarea { min-height: 70px; }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #0b1020; border: none; border-radius: 8px;
    padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 8px; }
  .preset {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .preset:hover { color: var(--text); border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    min-width: 30px; height: 27px; padding: 0 2px; display: flex; align-items: center;
    justify-content: center; background: var(--panel2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; font-size: 11px; cursor: pointer;
    user-select: none; border-bottom-width: 3px;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.early   { border-bottom-color: #4ec9b0; }
  .chip.concept { border-bottom-color: var(--abl); }
  .chip.late    { border-bottom-color: var(--accent); }
  .chip.sel { background: var(--abl); color: #1a1205; border-color: var(--abl); font-weight: 700; }
  .metrics {
    display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0;
  }
  .metric {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; min-width: 130px;
  }
  .metric .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .metric .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 780px) { .panels { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .panel h2 {
    margin: 0; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .panel.base h2 .dot { background: var(--base); }
  .panel.abl h2 .dot { background: var(--abl); }
  .panel .body {
    padding: 14px; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    min-height: 120px;
  }
  .status { color: var(--muted); font-size: 12px; margin: 10px 0; min-height: 18px; }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted);
    border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -1px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🧠 Llama Layer Ablation</h1>
  <span class="sub">Remove one decoder layer &amp; compare generation · Llama-3.1-8B-Instruct</span>
</header>

<div class="wrap">
  <div class="controls">
    <div class="full">
      <label for="prompt">Your prompt</label>
      <textarea id="prompt" placeholder="Ask the assistant anything…">Explain why the sky is blue in two sentences.</textarea>
    </div>
    <div class="full">
      <label for="system">System prompt</label>
      <input id="system" value="You are a helpful assistant." />
    </div>
    <div class="full">
      <label>Remove decoder layers <span id="selCount" style="color:var(--abl);font-weight:600"></span> — click to toggle (0–31); bottom bar = t-SNE regime</label>
      <div class="presets">
        <button type="button" class="preset" data-preset="l15">Just L15</button>
        <button type="button" class="preset" data-preset="concept">Concept L6–L17</button>
        <button type="button" class="preset" data-preset="early">Early 0–4</button>
        <button type="button" class="preset" data-preset="late">Late 28–31</button>
        <button type="button" class="preset" data-preset="clear">Clear</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="hint" id="selHint"></div>
    </div>
    <div>
      <label for="maxTokens">Max new tokens</label>
      <input id="maxTokens" type="number" value="256" min="1" max="2048" />
    </div>
    <div>
      <label for="temp">Temperature</label>
      <input id="temp" type="number" value="0" min="0" max="2" step="0.1" />
      <div class="hint">0 = greedy (reproducible)</div>
    </div>
    <div>
      <label for="api">API base URL</label>
      <input id="api" value="http://localhost:8000" />
      <div class="hint">SSH-tunneled from the VM</div>
    </div>
    <div class="full row">
      <button id="go">Generate &amp; compare</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="metrics" id="metrics" style="display:none">
    <div class="metric"><div class="k">KL divergence</div><div class="v" id="mKl">—</div></div>
    <div class="metric"><div class="k">Top-1 agreement</div><div class="v" id="mTop1">—</div></div>
    <div class="metric"><div class="k">Positions</div><div class="v" id="mPos">—</div></div>
    <div class="metric"><div class="k">Time (base / abl)</div><div class="v" id="mTime">—</div></div>
  </div>

  <div class="panels">
    <div class="panel base">
      <h2><span class="dot"></span> Baseline <span style="color:var(--muted);font-weight:400">(full model)</span></h2>
      <div class="body" id="outBase">—</div>
    </div>
    <div class="panel abl">
      <h2><span class="dot"></span> Ablated <span id="ablLabel" style="color:var(--muted);font-weight:400">(1 removed)</span></h2>
      <div class="body" id="outAbl">—</div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // Multi-layer selection: a 0..31 toggle grid, colour-coded by t-SNE regime.
  // Concept-forming band = decoder 5..16 (t-SNE plots L6..L17).
  const N_LAYERS = 32;
  const selected = new Set([14]);            // default: decoder 14 = plot L15
  const regime = (i) => (i <= 4 ? "early" : i <= 16 ? "concept" : "late");
  const chipsEl = $("chips");

  function renderChips() {
    chipsEl.innerHTML = "";
    for (let i = 0; i < N_LAYERS; i++) {
      const c = document.createElement("div");
      c.className = "chip " + regime(i) + (selected.has(i) ? " sel" : "");
      c.textContent = i;
      c.title = `decoder ${i} → plot L${i + 1}`;
      c.addEventListener("click", () => {
        selected.has(i) ? selected.delete(i) : selected.add(i);
        renderChips();
        updateSel();
      });
      chipsEl.appendChild(c);
    }
  }
  const selectedSorted = () => [...selected].sort((a, b) => a - b);
  function updateSel() {
    const arr = selectedSorted();
    $("selCount").textContent = arr.length ? `— ${arr.length} selected` : "— none";
    $("selHint").textContent = arr.length
      ? `removing decoder ${arr.join(", ")}   ·   t-SNE ${arr.map((i) => "L" + (i + 1)).join(", ")}`
      : "no layers selected → ablated output = baseline";
    $("ablLabel").textContent = arr.length ? `(${arr.length} removed)` : "(baseline)";
  }
  document.querySelectorAll(".preset").forEach((b) =>
    b.addEventListener("click", () => {
      const p = b.dataset.preset;
      if (p === "clear") selected.clear();
      else if (p === "l15") { selected.clear(); selected.add(14); }
      else if (p === "concept") { for (let i = 5; i <= 16; i++) selected.add(i); }
      else if (p === "early") { for (let i = 0; i <= 4; i++) selected.add(i); }
      else if (p === "late") { for (let i = 28; i <= 31; i++) selected.add(i); }
      renderChips();
      updateSel();
    })
  );
  renderChips();
  updateSel();

  function setStatus(msg, cls = "") {
    const s = $("status");
    s.className = "status " + cls;
    s.innerHTML = msg;
  }

  async function generate() {
    const api = $("api").value.replace(/\/+$/, "");
    const body = {
      prompt: $("prompt").value,
      system_prompt: $("system").value,
      layers: selectedSorted(),
      max_new_tokens: +$("maxTokens").value,
      temperature: +$("temp").value,
    };
    $("go").disabled = true;
    setStatus('<span class="spinner"></span>Running baseline + ablated generation on the VM…');
    $("outBase").textContent = "…";
    $("outAbl").textContent = "…";
    $("metrics").style.display = "none";

    try {
      const res = await fetch(api + "/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      const d = await res.json();

      $("outBase").textContent = d.baseline || "(empty)";
      $("outAbl").textContent = d.ablated || "(empty)";
      const n = (d.layers || []).length;
      $("ablLabel").textContent = n
        ? `(${n} removed: ${d.plot_labels})`
        : "(baseline)";

      $("mKl").textContent = d.metrics.kl_mean;
      $("mTop1").textContent = (d.metrics.top1_agreement * 100).toFixed(1) + "%";
      $("mPos").textContent = d.metrics.n_positions;
      $("mTime").textContent = `${d.timing.baseline_s}s / ${d.timing.ablated_s}s`;
      $("metrics").style.display = "flex";
      setStatus("Done. Higher KL / lower agreement = the removed layers mattered more.", "ok");
    } catch (e) {
      setStatus("Error: " + e.message + " — is the SSH tunnel up and the server running?", "err");
      $("outBase").textContent = "—";
      $("outAbl").textContent = "—";
    } finally {
      $("go").disabled = false;
    }
  }

  $("go").addEventListener("click", generate);
  $("prompt").addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") generate();
  });
</script>
</body>
</html>
