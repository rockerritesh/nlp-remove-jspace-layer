[project]
name = "nlp-remove-jspace-layer"
version = "0.1.0"
description = "Mac-side client for the Llama-3.1-8B layer-ablation experiment (UI + plotting)."
requires-python = ">=3.10"
# Mac side only: the UI (ui.html) needs nothing; these power client.py.
# The heavy model deps (torch/transformers/...) live on the VM, not here.
dependencies = [
    "requests>=2.31",
    "matplotlib>=3.7",
    # nnsight remote experiments (experiments/nnsight_*.py). nnsight 0.7 needs
    # transformers in [4.48, 5.0); NDIF free tier runs the pinned base Llama-3.1.
    "nnsight>=0.7",
    "python-dotenv>=1.0",
    "transformers>=4.48,<5",
]

[tool.uv]
package = false
